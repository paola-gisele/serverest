name: Cypress Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      grep_tags:
        description: 'Filter tests by tags (e.g., @api, @frontend, @login). Use | for OR, , for AND'
        required: false
        default: ''

jobs:
  cypress-api:
    name: API Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || !(contains(github.event.inputs.grep_tags, '@frontend') && !contains(github.event.inputs.grep_tags, '|'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine API Test Tags
        id: api_tags
        run: |
          TAGS="${{ github.event.inputs.grep_tags }}"
          if [[ -z "$TAGS" ]]; then
            echo "grep_tags=@api" >> $GITHUB_OUTPUT
          elif [[ "$TAGS" != *"@api"* && "$TAGS" != *"@frontend"* ]]; then
            echo "grep_tags=@api,$TAGS" >> $GITHUB_OUTPUT
          elif [[ "$TAGS" == *"@frontend"* ]]; then
            echo "grep_tags=${TAGS//@frontend/@api}" >> $GITHUB_OUTPUT
          else
            echo "grep_tags=$TAGS" >> $GITHUB_OUTPUT
          fi

      - name: Run API Tests
        run: npm run cy:run:tags
        env:
          TEST_ENV: production
          GREP_TAGS: ${{ steps.api_tags.outputs.grep_tags }}

      - name: Upload API Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report
          path: cypress/reports/
          retention-days: 30

  cypress-frontend:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || !(contains(github.event.inputs.grep_tags, '@api') && !contains(github.event.inputs.grep_tags, '|'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine Frontend Test Tags
        id: frontend_tags
        run: |
          TAGS="${{ github.event.inputs.grep_tags }}"
          if [[ -z "$TAGS" ]]; then
            echo "grep_tags=@frontend" >> $GITHUB_OUTPUT
          elif [[ "$TAGS" != *"@api"* && "$TAGS" != *"@frontend"* ]]; then
            echo "grep_tags=@frontend,$TAGS" >> $GITHUB_OUTPUT
          elif [[ "$TAGS" == *"@api"* ]]; then
            echo "grep_tags=${TAGS//@api/@frontend}" >> $GITHUB_OUTPUT
          else
            echo "grep_tags=$TAGS" >> $GITHUB_OUTPUT
          fi

      - name: Run Frontend E2E Tests
        run: npm run cy:run:tags -- --browser chrome
        env:
          TEST_ENV: production
          GREP_TAGS: ${{ steps.frontend_tags.outputs.grep_tags }}

      - name: Upload Frontend Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-report
          path: cypress/reports/
          retention-days: 30
